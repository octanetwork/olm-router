services:
  olm-router:
    build: .
    image: olm-router:${OLM_RELEASE:-local}
    container_name: olm-router
    restart: unless-stopped
    init: true
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 100
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      OLM_PANEL_ORIGIN: https://olm.octx.space
      OLM_PROXY_ROUTES: http://olm-egress:1080
      OLM_TRUSTED_PROXIES: ${OLM_CADDY_IP:?set the exact ingress address}
    ports: ['127.0.0.1:18045:8045']
    volumes: ['./data:/app/data']
    tmpfs: ['/tmp:size=16m,mode=1777']
    networks: [default, ingress]
    logging:
      driver: json-file
      options: {max-size: '5m', max-file: '3'}
  olm-egress:
    image: ${OLM_EGRESS_IMAGE:?pin the existing xray image digest}
    container_name: olm-egress
    restart: unless-stopped
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 128m
    pids_limit: 50
    command: ['run', '-config', '/etc/xray/config.json']
    volumes: ['./egress.json:/etc/xray/config.json:ro']
    networks: [default]
    logging:
      driver: json-file
      options: {max-size: '5m', max-file: '3'}
networks:
  ingress:
    external: true
    name: remnawave-network
